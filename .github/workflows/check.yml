name: Validate
on:
  push:
    branches: ['main']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - name: Set up Node.js 24 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run application checks and production builds
        run: pnpm check
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install chromium
      - name: Run browser interaction regressions
        run: pnpm test:ui
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: .test-data/playwright/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Run Electron smoke test
        run: node scripts/smoke.mjs
      - name: Run real-data Electron smoke test
        run: node scripts/smoke.mjs --real
