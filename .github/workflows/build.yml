name: Build Windows EXE

on:
  push:
    tags:
      - 'v*' # Automatically build and release when pushing tags such as v4.0.1
  workflow_dispatch: {} # Also available via Run workflow on GitHub

permissions:
  contents: write # Required to create a release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The stable release tag must match package.json: v$version"
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Set up Node.js 24 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run type checks
        run: pnpm typecheck

      - name: Run regression tests
        run: pnpm test

      - name: Build NSIS installer and portable executable
        run: pnpm dist
        env:
          POSTHOG_CLI_HOST: https://posthog.jamesflare.com
          POSTHOG_CLI_PROJECT_ID: '1'
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}

      - name: Upload release source maps to PostHog
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          POSTHOG_CLI_HOST: https://posthog.jamesflare.com
          POSTHOG_CLI_PROJECT_ID: '1'
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          if ($env:POSTHOG_CLI_API_KEY) {
            pnpm posthog:sourcemaps
            if ($LASTEXITCODE -ne 0) { throw 'PostHog source map upload failed.' }
          } else {
            Write-Output '::warning::PostHog source map upload skipped: POSTHOG_CLI_API_KEY is not configured.'
          }

      - name: Verify update release artifacts
        run: node scripts/verify-update-artifacts.mjs

      - name: Run packaged Electron smoke test
        run: pnpm smoke:packaged

      - name: Run real-data packaged Electron smoke test
        run: pnpm smoke:packaged --real

      - name: Upload build artifacts (downloadable from the workflow page)
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub release (tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
