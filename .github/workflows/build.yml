name: 打包 EXE（自动构建）

on:
  push:
    tags:
      - 'v*' # 推送 v3.0.0 这类标签时自动打包并发布
  workflow_dispatch: {} # 也可在 GitHub 页面手动点 Run workflow

permissions:
  contents: write # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: 安装 Node.js 24（LTS）
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与回归测试
        run: pnpm typecheck && pnpm test

      - name: 打包（nsis 安装版 + portable 便携版）
        run: pnpm dist

      - name: 上传构建产物（工作流页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

      - name: 创建 GitHub Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          fail_on_unmatched_files: false
